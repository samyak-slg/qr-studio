<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate, style and download QR codes for links, text, email, phone numbers and Wi-Fi. Runs entirely in your browser."
    />
    <meta name="theme-color" content="#1a73e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QR Studio · QR Code Generator & Designer</title>
    <script>
      // Apply the saved theme before the first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var theme = localStorage.getItem('qr-studio:theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
